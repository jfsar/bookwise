name: Deploy to Wasmer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: laravel
          POSTGRES_PASSWORD: password
          POSTGRES_DB: laravel_testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Validate required secrets
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          WASMER_TOKEN: ${{ secrets.WASMER_TOKEN }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_HOST_DIRECT: ${{ secrets.DB_HOST_DIRECT }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          AWS_BUCKET: ${{ secrets.AWS_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT: ${{ secrets.AWS_ENDPOINT }}
        run: |
          missing=()
          for secret in APP_KEY WASMER_TOKEN DB_HOST DB_HOST_DIRECT DB_DATABASE DB_USERNAME DB_PASSWORD REDIS_HOST REDIS_PASSWORD MAIL_USERNAME MAIL_PASSWORD AWS_BUCKET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_ENDPOINT; do
            value="${!secret}"
            if [ -z "$value" ]; then
              missing+=("$secret")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}" >&2
            echo "Add them as GitHub Actions secrets in the repository or environment settings." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Laravel storage directories
        run: mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/testing storage/framework/views storage/logs bootstrap/cache

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, bcmath, intl, pdo, pdo_pgsql
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies (with dev, for testing)
        run: |
          composer install \
            --prefer-dist \
            --no-interaction

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate
          echo "TEST_DB_HOST=127.0.0.1" >> .env
          echo "TEST_DB_PORT=5432" >> .env
          echo "TEST_DB_USERNAME=laravel" >> .env
          echo "TEST_DB_PASSWORD=password" >> .env
          echo "TEST_DB_DATABASE=laravel_testing" >> .env
          echo "TEST_DB_SSLMODE=disable" >> .env

      - name: Run tests
        run: php artisan test

      - name: Install Composer dependencies (production, strip dev)
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --optimize-autoloader \
            --no-interaction

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Inertia React
        run: npm run build

      - name: Verify Laravel build
        run: |
          test -f vendor/autoload.php
          test -f public/build/manifest.json

      - name: Install Wasmer
        run: curl https://get.wasmer.io -sSfL | sh

      - name: Authenticate with Wasmer
        env:
          WASMER_TOKEN: ${{ secrets.WASMER_TOKEN }}
        run: |
          echo "$HOME/.wasmer/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.wasmer/bin:$PATH"
          wasmer login "$WASMER_TOKEN"

      - name: Deploy to Wasmer
        env:
          WASMER_TOKEN: ${{ secrets.WASMER_TOKEN }}
        run: |
          export PATH="$HOME/.wasmer/bin:$PATH"
          wasmer deploy --non-interactive

      - name: Run production database migrations
        env:
          DB_HOST_DIRECT: ${{ secrets.DB_HOST_DIRECT }}
          DB_PORT: ${{ secrets.DB_PORT || '5432' }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSLMODE: require
          APP_KEY: ${{ secrets.APP_KEY }}
        run: php artisan migrate --force --database=pgsql_direct

      - name: Seed production database (idempotent reference data)
        env:
          DB_HOST_DIRECT: ${{ secrets.DB_HOST_DIRECT }}
          DB_PORT: ${{ secrets.DB_PORT || '5432' }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSLMODE: require
          APP_KEY: ${{ secrets.APP_KEY }}
        run: php artisan db:seed --force --no-interaction --database=pgsql_direct

      - name: Sync secrets to Wasmer
        env:
          WASMER_TOKEN: ${{ secrets.WASMER_TOKEN }}
        run: |
          export PATH="$HOME/.wasmer/bin:$PATH"

          sync_secret() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "::warning::Skipping empty secret: $name"
              return 0
            fi
            wasmer app secrets update "$name" "$value" || \
            wasmer app secrets create "$name" "$value"
          }

          sync_secret APP_KEY "${{ secrets.APP_KEY }}"
          sync_secret DB_HOST "${{ secrets.DB_HOST }}"
          sync_secret DB_HOST_DIRECT "${{ secrets.DB_HOST_DIRECT }}"
          sync_secret DB_DATABASE "${{ secrets.DB_DATABASE }}"
          sync_secret DB_USERNAME "${{ secrets.DB_USERNAME }}"
          sync_secret DB_PASSWORD "${{ secrets.DB_PASSWORD }}"
          sync_secret REDIS_HOST "${{ secrets.REDIS_HOST }}"
          sync_secret REDIS_PASSWORD "${{ secrets.REDIS_PASSWORD }}"
          sync_secret MAIL_USERNAME "${{ secrets.MAIL_USERNAME }}"
          sync_secret MAIL_PASSWORD "${{ secrets.MAIL_PASSWORD }}"
          sync_secret AWS_BUCKET "${{ secrets.AWS_BUCKET }}"
          sync_secret AWS_ACCESS_KEY_ID "${{ secrets.AWS_ACCESS_KEY_ID }}"
          sync_secret AWS_SECRET_ACCESS_KEY "${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          sync_secret AWS_ENDPOINT "${{ secrets.AWS_ENDPOINT }}"

      - name: Redeploy to Wasmer (apply secrets)
        env:
          WASMER_TOKEN: ${{ secrets.WASMER_TOKEN }}
        run: |
          export PATH="$HOME/.wasmer/bin:$PATH"
          wasmer deploy --non-interactive

      - name: Health check
        run: |
          if [ -z "${{ vars.APP_URL }}" ]; then
            echo "::error::APP_URL variable is not set. Add it in the 'production' environment settings." >&2
            exit 1
          fi
          for i in 1 2 3 4 5 6; do
            if curl -sSf --max-time 15 "${{ vars.APP_URL }}/up"; then
              echo "Health check passed."
              exit 0
            fi
            echo "Attempt $i failed. Retrying in 10s..."
            sleep 10
          done
          echo "::error::Health check failed after 6 attempts." >&2
          exit 1
