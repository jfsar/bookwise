kind: wasmer.io/App.v0
name: bookwise
package: .

scaling:
  mode: single_concurrency

jobs:
  - name: run-migrations
    trigger: pre-deployment
    action:
      execute:
        command: migrate
        timeout: 5m

capabilities:
  instaboot:
    requests:
      - path: /

env:
  # ── App ──────────────────────────────────────────────────────
  APP_NAME: "BookWise"
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_URL: "" # set to https://bookwise.<your-username>.wasmer.app after first deploy
  APP_LOCALE: "en"
  APP_FALLBACK_LOCALE: "en"
  APP_MAINTENANCE_DRIVER: "file"
  BCRYPT_ROUNDS: "12"

  # ── Logging ──────────────────────────────────────────────────
  LOG_CHANNEL: "stack"
  LOG_STACK: "single"
  LOG_DEPRECATIONS_CHANNEL: "null"
  LOG_LEVEL: "warning"

  # ── Database (Neon PostgreSQL) ───────────────────────────────
  DB_CONNECTION: "pgsql"
  DB_HOST: "ep-small-smoke-b342x1re-pooler.c-4.ap-southeast-1.aws.neon.tech" # Neon pooler host
  DB_PORT: "5432"
  DB_DATABASE: "neondb"
  DB_USERNAME: "neondb_owner" # Neon username
  DB_PASSWORD: "npg_dKSg54jsbEDw" # Neon password
  DB_SSLMODE: "require"

  # ── Session ──────────────────────────────────────────────────
  SESSION_DRIVER: "database"
  SESSION_LIFETIME: "120"
  SESSION_ENCRYPT: "false"
  SESSION_PATH: "/"
  SESSION_DOMAIN: "null"
  SESSION_SECURE_COOKIE: "true"

  # ── Cache & Queue (Upstash Redis) ───────────────────────────
  CACHE_STORE: "redis"
  REDIS_CACHE_DB: "0"
  QUEUE_CONNECTION: "redis"
  REDIS_CLIENT: "phpredis"
  REDIS_HOST: "tls://finer-alien-97756.upstash.io" # Upstash Redis endpoint (include tls:// prefix)
  REDIS_PORT: "6379"
  REDIS_PASSWORD: "gQAAAAAAAX3cAAIgcDIzYzU1YzhkZGNiODc0ZjY1YjRjODI5N2VjYjZhMGYwZA" # Upstash Redis password

  # ── Broadcasting ─────────────────────────────────────────────
  BROADCAST_CONNECTION: "log"

  # ── Filesystem (Cloudflare R2) ──────────────────────────────
  FILESYSTEM_DISK: "s3"
  AWS_BUCKET: "hardware" # R2 bucket name
  AWS_ACCESS_KEY_ID: "9ec2c146ebd28a9151a0362e3be2dd53" # R2 API token Access Key ID
  AWS_SECRET_ACCESS_KEY: "ce69fa4293124055f1ac31f427f42227e323fe214d73f3a5050949621a94bf7c" # R2 API token Secret Access Key
  AWS_DEFAULT_REGION: "auto"
  AWS_ENDPOINT: "https://7b77e645ea1d9d284cc902ffe0fc5dde.r2.cloudflarestorage.com" # R2 endpoint URL
  AWS_USE_PATH_STYLE_ENDPOINT: "true"

  # ── Mail (Mailtrap SMTP) ────────────────────────────────────
  MAIL_MAILER: "smtp"
  MAIL_HOST: "sandbox.smtp.mailtrap.io"
  MAIL_PORT: "2525"
  MAIL_USERNAME: "1a634efcacb5de"
  MAIL_PASSWORD: "06748c564ff808"
  MAIL_FROM_ADDRESS: "book_wise@example.com"
  MAIL_FROM_NAME: "BookWise"

  # ── Vite ─────────────────────────────────────────────────────
  VITE_APP_NAME: "BookWise"
