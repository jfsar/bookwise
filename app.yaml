# Wasmer Edge app configuration — BookWise
#
# Only non-sensitive, safe-to-commit values live here (sourced from
# _env.example). Sensitive values (DB credentials, APP_KEY, Redis auth,
# mail credentials, AWS/R2 keys) are NOT set here — they're managed as
# encrypted Wasmer secrets and synced from GitHub Actions on each deploy
# (see deploy.yml).

kind: wasmer.io/App.v0
owner: jfsar # TODO: replace with your Wasmer namespace/username
name: BookWise
package: . # TODO: match owner above
debug: false

env:
  APP_NAME: BookWise
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: "https://bookwise.wasmer.app" # TODO: replace with real deployed URL

  APP_LOCALE: en
  APP_FALLBACK_LOCALE: en
  APP_FAKER_LOCALE: en_US

  APP_MAINTENANCE_DRIVER: file

  BCRYPT_ROUNDS: "12"

  LOG_CHANNEL: stack
  LOG_STACK: single
  LOG_DEPRECATIONS_CHANNEL: "null"
  LOG_LEVEL: error # quieter than the local "debug" default now that this is production

  DB_CONNECTION: pgsql
  DB_PORT: "5432"
  DB_SSLMODE: require

  SESSION_DRIVER: database
  SESSION_LIFETIME: "120"
  SESSION_ENCRYPT: "false"
  SESSION_PATH: /
  SESSION_DOMAIN: "null"
  SESSION_SECURE_COOKIE: "true" # cookies over HTTPS only in production

  BROADCAST_CONNECTION: log
  FILESYSTEM_DISK: local
  QUEUE_CONNECTION: redis

  CACHE_STORE: redis
  REDIS_CACHE_DB: "0"

  MEMCACHED_HOST: 127.0.0.1

  REDIS_CLIENT: phpredis
  REDIS_PORT: "6379" # TODO: confirm against your Upstash/Redis provider's port

  MAIL_MAILER: smtp
  MAIL_SCHEME: "null"
  MAIL_HOST: sandbox.smtp.mailtrap.io # TODO: swap for a production mail host if not staying on Mailtrap sandbox
  MAIL_PORT: "2525"
  MAIL_FROM_ADDRESS: book_wise@example.com # TODO: replace with real sender address
  MAIL_FROM_NAME: BookWise

  AWS_DEFAULT_REGION: auto
  AWS_USE_PATH_STYLE_ENDPOINT: "true"

  VITE_APP_NAME: BookWise
