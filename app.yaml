name: bookwise
owner: jfsar
package: .
env:
  APP_NAME: BookWise
  APP_ENV: production
  APP_DEBUG: 'false'
  APP_URL: ''
  APP_LOCALE: en
  APP_FALLBACK_LOCALE: en
  APP_MAINTENANCE_DRIVER: file
  BCRYPT_ROUNDS: '12'
  LOG_CHANNEL: stack
  LOG_STACK: single
  LOG_DEPRECATIONS_CHANNEL: 'null'
  LOG_LEVEL: warning
  DB_CONNECTION: pgsql
  DB_HOST: ''
  DB_PORT: '5432'
  DB_DATABASE: neondb
  DB_USERNAME: ''
  DB_PASSWORD: ''
  DB_SSLMODE: require
  SESSION_DRIVER: database
  SESSION_LIFETIME: '120'
  SESSION_ENCRYPT: 'false'
  SESSION_PATH: /
  SESSION_DOMAIN: 'null'
  SESSION_SECURE_COOKIE: 'true'
  CACHE_STORE: redis
  REDIS_CACHE_DB: '0'
  QUEUE_CONNECTION: redis
  REDIS_CLIENT: phpredis
  REDIS_HOST: ''
  REDIS_PORT: '6379'
  REDIS_PASSWORD: ''
  BROADCAST_CONNECTION: log
  FILESYSTEM_DISK: s3
  AWS_BUCKET: ''
  AWS_ACCESS_KEY_ID: ''
  AWS_SECRET_ACCESS_KEY: ''
  AWS_DEFAULT_REGION: auto
  AWS_ENDPOINT: ''
  AWS_USE_PATH_STYLE_ENDPOINT: 'true'
  MAIL_MAILER: smtp
  MAIL_HOST: sandbox.smtp.mailtrap.io
  MAIL_PORT: '2525'
  MAIL_USERNAME: ''
  MAIL_PASSWORD: ''
  MAIL_FROM_ADDRESS: book_wise@example.com
  MAIL_FROM_NAME: BookWise
  VITE_APP_NAME: BookWise
capabilities:
  instaboot:
    mode: null
    requests:
    - path: /
scaling:
  mode: single_concurrency
jobs:
- name: run-migrations
  trigger: pre-deployment
  action:
    execute:
      command: migrate
kind: wasmer.io/App.v0
