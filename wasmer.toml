[package]
name = "bookwise"
version = "1.0.0"
description = "BookWise — double-entry accounting system"

[dependencies]
"php/php" = "=8.3.4"

[fs]
"/app/" = "."
"/config" = "config"

[[command]]
name = "run"
module = "php/php:php"
runner = "wasi"

[command.annotations.wasi]
main-args = ["-t", "/app/public", "-S", "0.0.0.0:8080"]
env = ["PHPRC=/config/"]

[[command]]
name = "migrate"
module = "php/php:php"
runner = "wasi"

[command.annotations.wasi]
main-args = ["/app/artisan", "migrate", "--force"]
env = ["PHPRC=/config/"]
