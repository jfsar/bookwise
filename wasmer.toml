[dependencies]
"php/php" = "=8.3.4"
 
[fs]
"/app/" = "."
 
[[command]]
name = "run"
module = "php/php:php"
runner = "wasi"
[command.annotations.wasi]
main-args = ["-t", "/app/public", "-S", "localhost:8080"]

[[command]]
name = "queue-worker"
module = "php/php:php"
runner = "wasi"
[command.annotations.wasi]
main-args = ["/app/artisan", "queue:work", "--stop-when-empty", "--tries=3", "--timeout=600"]